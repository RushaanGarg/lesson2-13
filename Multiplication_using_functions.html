<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Using Functions</title>
</head>
<body>
    <h1>Multiplicating Using Functions</h1>
    <h3>Multiplication of two numbers using functions</h3>
    <button onclick="resultofmultiplication(6,7)"> click me for the result</button>
    <script>
        function resultofmultiplication(x,y)
        {
            if (y ===undefined){y=7}
        document.write(x*y);
        }
    </script>
</body>
</html>
